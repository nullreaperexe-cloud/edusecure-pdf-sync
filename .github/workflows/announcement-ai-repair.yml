name: Repair Existing Announcements with AI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "announcement_ai_repair.py"
      - "announcement_processor.py"
      - "openrouter_title.py"
      - ".github/workflows/announcement-ai-repair.yml"

permissions:
  contents: read

concurrency:
  group: announcement-ai-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate AI announcement repair
        run: |
          python -m py_compile announcement_ai_repair.py announcement_processor.py openrouter_title.py runner.py
          python -m unittest -v test_announcements.py

      - name: Repair all existing announcements
        env:
          PYTHONUNBUFFERED: "1"
          FIREBASE_ADMIN_PASSWORD: ${{ secrets.FIREBASE_ADMIN_PASSWORD }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python announcement_ai_repair.py
