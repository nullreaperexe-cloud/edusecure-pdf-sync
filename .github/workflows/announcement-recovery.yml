name: Recover Missed Recent Announcements

on:
  workflow_dispatch:
  schedule:
    - cron: "13 10 * * *"
  push:
    branches: [main]
    paths:
      - "RUN_ANNOUNCEMENT_RECOVERY.txt"
      - ".github/workflows/announcement-recovery.yml"

permissions:
  contents: read

concurrency:
  group: edusecure-recent-announcement-recovery
  cancel-in-progress: false

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate before recovering
        run: |
          python -m py_compile announcement_backfill.py announcement_processor.py pdf_integrity.py
          python -m unittest -v test_announcements.py test_pdf_integrity.py
      - name: Recover missed recent announcements
        env:
          PYTHONUNBUFFERED: "1"
          EDUSECURE_USERNAME: ${{ secrets.EDUSECURE_USERNAME }}
          EDUSECURE_PASSWORD: ${{ secrets.EDUSECURE_PASSWORD }}
          FIREBASE_ADMIN_EMAIL: ${{ secrets.FIREBASE_ADMIN_EMAIL || vars.FIREBASE_ADMIN_EMAIL }}
          FIREBASE_ADMIN_PASSWORD: ${{ secrets.FIREBASE_ADMIN_PASSWORD }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANNOUNCEMENT_BACKFILL_RECENT_DAYS: "30"
          ANNOUNCEMENT_BACKFILL_MAX_MESSAGES: "700"
        run: python announcement_backfill.py
