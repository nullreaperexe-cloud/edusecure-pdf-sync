name: Cancel Legacy EduSecure Worker

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cancel-legacy-worker.yml"

permissions:
  contents: read

concurrency:
  group: edusecure-24x7-worker
  cancel-in-progress: true

jobs:
  cancel-legacy:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Legacy long-running worker replaced by bounded v2 worker."
