name: One-Time Drive-First Worker Handoff
on:
  push:
    paths:
      - ".github/workflows/drive-first-handoff.yml"
permissions:
  actions: write
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Cancel old 8aPDF worker
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OLD_RUN_ID: "39389635807"
        run: |
          set -euo pipefail
          STATUS="$(gh api "repos/$GH_REPO/actions/runs/$OLD_RUN_ID" --jq '.status')"
          echo "Old worker #2716: $STATUS"
          if [ "$STATUS" != "completed" ]; then
            gh api --method POST "repos/$GH_REPO/actions/runs/$OLD_RUN_ID/cancel"
            echo "Old worker cancellation requested."
          fi
      - name: Wait for cancellation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OLD_RUN_ID: "39389635807"
        run: |
          set -euo pipefail
          for attempt in {1..24}; do
            STATE="$(gh api "repos/$GH_REPO/actions/runs/$OLD_RUN_ID" --jq '.status')"
            echo "Old worker state: $STATE"
            if [ "$STATE" = "completed" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Old worker did not stop in time"
          exit 1
      - name: Dispatch latest Drive-first worker if necessary
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run sync.yml --repo "$GH_REPO" --ref main
          echo "Requested a fresh Drive-first worker on the latest main branch."
