name: Validate Drive-First Code (one time)
on:
  push:
    paths:
      - ".github/workflows/drive-first-validation.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate syntax and regression tests
        run: |
          python -m py_compile drive_backup.py drive_first.py supabase_materials.py supabase_announcements.py worker_loop.py
          python -m unittest discover -v
