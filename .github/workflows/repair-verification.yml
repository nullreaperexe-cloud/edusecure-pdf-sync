name: EduSecure Repair Verification

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/repair-verification.yml"

permissions:
  contents: read

concurrency:
  group: edusecure-repair-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate automation
        run: |
          python -m py_compile runner.py sync.py sync_repair.py announcement_processor.py openrouter_title.py
          python -m unittest -v test_title_intelligence.py test_announcements.py

      - name: Run one real EduSecure sync
        env:
          PYTHONUNBUFFERED: "1"
          EDUSECURE_USERNAME: ${{ secrets.EDUSECURE_USERNAME }}
          EDUSECURE_PASSWORD: ${{ secrets.EDUSECURE_PASSWORD }}
          FIREBASE_ADMIN_EMAIL: ${{ secrets.FIREBASE_ADMIN_EMAIL || vars.FIREBASE_ADMIN_EMAIL }}
          FIREBASE_ADMIN_PASSWORD: ${{ secrets.FIREBASE_ADMIN_PASSWORD }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANNOUNCEMENT_RECOVERY_DAYS: "7"
        run: python sync_repair.py
