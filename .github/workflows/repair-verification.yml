name: EduSecure Repair Verification

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/repair-verification.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: edusecure-repair-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate automation
        run: |
          python -m py_compile runner.py sync.py sync_repair.py announcement_processor.py groq_title.py
          python -m unittest -v test_title_intelligence.py test_announcements.py

      # Supabase's GitHub OIDC trust policy intentionally authorizes only
      # sync.yml for live writes. Running sync_repair.py here would get 401.
      # Verify this workflow's code offline; the live sync.yml job validates
      # Supabase read/write and runs the real school worker independently.
      - name: Confirm integration verification location
        run: echo "Code checks passed. Live integration is checked by EduSecure PDF Sync (sync.yml)."
