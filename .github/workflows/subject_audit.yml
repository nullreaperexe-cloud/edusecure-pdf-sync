name: Full Subject Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "title_cleaner.py"
      - "test_title_intelligence.py"
      - ".github/workflows/subject_audit.yml"

permissions:
  contents: read

jobs:
  audit-subjects:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install requests
        run: python -m pip install requests

      - name: Run title and subject intelligence tests
        run: python -m unittest -v test_title_intelligence.py

      - name: Audit and repair EduSecure title and subject fields
        env:
          PYTHONUNBUFFERED: "1"
          FIREBASE_ADMIN_PASSWORD: ${{ secrets.FIREBASE_ADMIN_PASSWORD }}
        run: python title_cleaner.py
