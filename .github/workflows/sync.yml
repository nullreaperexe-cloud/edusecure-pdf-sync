name: EduSecure PDF Sync

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "sync.py"
      - "sync_repair.py"
      - "sync_repair_v2.py"
      - "sync_repair_v3.py"
      - "requirements.txt"
      - ".github/workflows/sync.yml"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Sync EduSecure PDFs to 8aPDF ingest endpoint
        env:
          PYTHONUNBUFFERED: "1"
          EDUSECURE_USERNAME: ${{ secrets.EDUSECURE_USERNAME }}
          EDUSECURE_PASSWORD: ${{ secrets.EDUSECURE_PASSWORD }}
          AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
          INGEST_URL: https://eightapdf-study-library.nullreaper-exe.chatgpt.site/automation/ingest
        run: python sync_repair_v3.py

      - name: Upload sync diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edusecure-sync-diagnostics
          path: |
            sync_report.json
            debug_*.png
            /tmp/edusecure-downloads/*
          if-no-files-found: ignore
          retention-days: 7
