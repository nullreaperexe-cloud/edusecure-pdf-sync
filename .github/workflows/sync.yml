name: EduSecure PDF Sync
# Announcement pipeline: v4 batch-clean

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "runner.py"
      - "reliable_http.py"
      - "push_bridge.py"
      - "test_reliability.py"
      - "sync.py"
      - "sync_repair.py"
      - "supabase_materials.py"
      - "test_supabase_materials.py"
      - "title_cleaner.py"
      - "openrouter_title.py"
      - "announcement_processor.py"
      - "announcement_backfill.py"
      - "test_announcements.py"
      - "test_title_intelligence.py"
      - "test_sync_repair.py"
      - "requirements.txt"
      - ".github/workflows/sync.yml"
  schedule:
    # Independent 5-minute watchdog, offset from the busiest minute of each hour.
    # Does not depend on the previous job succeeding or dispatching another run.
    - cron: "2-59/5 * * * *"

permissions:
  contents: read

concurrency:
  # Only one active browser sync; a later scheduled run can safely retry errors.
  group: edusecure-scheduled-sync-v3
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Restore runtime sync cache
        uses: actions/cache@v6
        with:
          path: .edusecure_runtime_v2
          key: edusecure-runtime-v2-${{ github.run_id }}
          restore-keys: |
            edusecure-runtime-v2-

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate automation code
        id: validate
        run: |
          python -m py_compile runner.py sync.py sync_repair.py supabase_materials.py title_cleaner.py openrouter_title.py announcement_processor.py announcement_backfill.py pdf_integrity.py reliable_http.py push_bridge.py
          python -m unittest discover -v

      - name: Run one EduSecure sync cycle
        env:
          PYTHONUNBUFFERED: "1"
          MATERIAL_BACKEND: "supabase"
          SUPABASE_URL: "https://rzhtesfikvykdnmrqwjs.supabase.co"
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          EDUSECURE_USERNAME: ${{ secrets.EDUSECURE_USERNAME }}
          EDUSECURE_PASSWORD: ${{ secrets.EDUSECURE_PASSWORD }}
          FIREBASE_ADMIN_EMAIL: ${{ secrets.FIREBASE_ADMIN_EMAIL || vars.FIREBASE_ADMIN_EMAIL }}
          FIREBASE_ADMIN_PASSWORD: ${{ secrets.FIREBASE_ADMIN_PASSWORD }}
          ANNOUNCEMENT_RECOVERY_DAYS: "7"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set +e
          echo "===== EduSecure check at $(date -u '+%Y-%m-%d %H:%M:%S UTC') ====="
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error::Missing SUPABASE_SECRET_KEY. Add it under Settings > Secrets and variables > Actions."
            exit 2
          fi

          timeout --signal=TERM --kill-after=15s 18m python sync_repair.py
          EXIT_CODE=$?
          if [ "$EXIT_CODE" -eq 124 ] || [ "$EXIT_CODE" -eq 137 ]; then
            python -c 'import json,pathlib; p=pathlib.Path("sync_report.json"); d=json.loads(p.read_text()) if p.exists() else {}; d.update(status="timed_out",failures=d.get("failures",[])+["The sync cycle exceeded its time limit; the next cycle will retry"]); p.write_text(json.dumps(d,indent=2))'
          fi

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "EduSecure cycle failed with code ${EXIT_CODE}."
          else
            echo "EduSecure cycle completed cleanly."
          fi
          exit "$EXIT_CODE"

      - name: Add cycle status to the run summary
        if: always()
        run: |
          if [ -f sync_report.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat sync_report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload sync diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: edusecure-sync-diagnostics-${{ github.run_id }}
          path: |
            sync_report.json
            debug_*.png
          if-no-files-found: ignore
          retention-days: 7

