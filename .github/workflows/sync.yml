name: EduSecure PDF Sync
# Announcement pipeline: v4 batch-clean

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "runner.py"
      - "reliable_http.py"
      - "push_bridge.py"
      - "test_reliability.py"
      - "sync.py"
      - "sync_repair.py"
      - "supabase_gateway.py"
      - "supabase_materials.py"
      - "supabase_announcements.py"
      - "test_supabase_materials.py"
      - "test_supabase_announcements.py"
      - "title_cleaner.py"
      - "openrouter_title.py"
      - "announcement_processor.py"
      - "announcement_backfill.py"
      - "test_announcements.py"
      - "test_title_intelligence.py"
      - "test_sync_repair.py"
      - "requirements.txt"
      - ".github/workflows/sync.yml"
  schedule:
    # Independent 5-minute watchdog, offset from the busiest minute of each hour.
    # Does not depend on the previous job succeeding or dispatching another run.
    - cron: "2-59/5 * * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  # Only one active browser sync; a later scheduled run can safely retry errors.
  group: edusecure-scheduled-sync-v3
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Restore Supabase duplicate-protection cache
        uses: actions/cache@v6
        with:
          path: .edusecure_runtime_v2
          key: edusecure-runtime-v2-${{ github.run_id }}
          restore-keys: |
            edusecure-runtime-v2-

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate automation code
        id: validate
        run: |
          python -m py_compile runner.py sync.py sync_repair.py supabase_gateway.py supabase_materials.py supabase_announcements.py title_cleaner.py openrouter_title.py announcement_processor.py announcement_backfill.py pdf_integrity.py reliable_http.py push_bridge.py
          python -m unittest discover -v

      # Accept repository-scoped GitHub OIDC even when the organization customizes JWT sub.
      - name: Verify both Supabase tables through GitHub OIDC
        env:
          SUPABASE_URL: "https://xudhjwojgxblbsebkzso.supabase.co"
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import supabase_gateway as gateway
          gateway.health()
          lists = {}
          for action, table in [("listMaterials", "study_materials"), ("listAnnouncements", "announcements")]:
              result = gateway.call(action)
              records = result.get("records")
              if not isinstance(records, list):
                  raise RuntimeError(f"Supabase {table} inventory missing")
              lists[table] = records
              print(f"Supabase {table}: {len(records)} accessible records.")

          # Existing identities exercise BOTH protected write paths with no new
          # records or changes. Missing/empty tables skip the duplicate probe.
          materials = lists["study_materials"]
          if materials:
              known = next((r for r in materials if r.get("id") and r.get("title") and r.get("pdf_url")), None)
              if known:
                  confirmed = gateway.call("insertMaterial", record={
                      "id": known["id"], "title": known["title"], "pdf_url": known["pdf_url"]
                  })
                  if not confirmed.get("duplicate"):
                      raise RuntimeError("Supabase PDF duplicate write probe failed")
                  print("Supabase PDF write path: authenticated and safely deduplicated.")

          announcements = lists["announcements"]
          if announcements:
              known = next((r for r in announcements if r.get("id") and r.get("title") and r.get("published") is True), None)
              if known:
                  confirmed = gateway.call("publishAnnouncement", record={
                      "id": known["id"], "title": known["title"], "ai_status": "pending"
                  })
                  if not confirmed.get("duplicate"):
                      raise RuntimeError("Supabase announcements duplicate write probe failed")
                  print("Supabase announcement write path: authenticated and safely deduplicated.")
          PY

      - name: Run one EduSecure sync cycle
        env:
          PYTHONUNBUFFERED: "1"
          EDUSECURE_USERNAME: ${{ secrets.EDUSECURE_USERNAME }}
          EDUSECURE_PASSWORD: ${{ secrets.EDUSECURE_PASSWORD }}
          SUPABASE_URL: "https://xudhjwojgxblbsebkzso.supabase.co"
          ANNOUNCEMENT_RECOVERY_DAYS: "7"
          CHECK_WEBSITE_DATE: "0"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set +e
          echo "===== EduSecure check at $(date -u '+%Y-%m-%d %H:%M:%S UTC') ====="

          timeout --signal=TERM --kill-after=15s 18m python sync_repair.py
          EXIT_CODE=$?
          if [ "$EXIT_CODE" -eq 124 ] || [ "$EXIT_CODE" -eq 137 ]; then
            python -c 'import json,pathlib; p=pathlib.Path("sync_report.json"); d=json.loads(p.read_text()) if p.exists() else {}; d.update(status="timed_out",failures=d.get("failures",[])+["The sync cycle exceeded its time limit; the next cycle will retry"]); p.write_text(json.dumps(d,indent=2))'
          fi

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "EduSecure cycle failed with code ${EXIT_CODE}."
          else
            echo "EduSecure cycle completed cleanly."
          fi
          exit "$EXIT_CODE"

      - name: Add cycle status to the run summary
        if: always()
        run: |
          if [ -f sync_report.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat sync_report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload sync diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: edusecure-sync-diagnostics-${{ github.run_id }}
          path: |
            sync_report.json
            debug_*.png
          if-no-files-found: ignore
          retention-days: 7

