name: EduSecure PDF Sync
# Announcement pipeline: v4 batch-clean

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "runner.py"
      - "sync.py"
      - "sync_repair.py"
      - "title_cleaner.py"
      - "openrouter_title.py"
      - "announcement_processor.py"
      - "announcement_backfill.py"
      - "test_announcements.py"
      - "test_title_intelligence.py"
      - "requirements.txt"
      - ".github/workflows/sync.yml"
  schedule:
    # Backup watchdog only. The active worker checks every 5 minutes itself.
    - cron: "17 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: edusecure-24x7-worker
  # A code push deploys immediately by replacing the old worker.
  # Scheduled/watchdog/dispatch runs never kill a healthy active worker.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate automation code
        run: |
          python -m py_compile runner.py sync.py sync_repair.py title_cleaner.py openrouter_title.py announcement_processor.py announcement_backfill.py
          python -m unittest -v test_title_intelligence.py test_announcements.py

      - name: Run EduSecure monitor every 5 minutes
        env:
          PYTHONUNBUFFERED: "1"
          EDUSECURE_USERNAME: ${{ secrets.EDUSECURE_USERNAME }}
          EDUSECURE_PASSWORD: ${{ secrets.EDUSECURE_PASSWORD }}
          FIREBASE_ADMIN_PASSWORD: ${{ secrets.FIREBASE_ADMIN_PASSWORD }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set +e
          END_TIME=$(( $(date +%s) + 19800 ))
          ITERATION=0

          echo "24/7 worker started. sync_repair.py will run every 5 minutes for about 5.5 hours."

          while [ "$(date +%s)" -lt "$END_TIME" ]; do
            ITERATION=$((ITERATION + 1))
            CYCLE_START=$(date +%s)
            echo ""
            echo "===== EduSecure check #${ITERATION} at $(date -u '+%Y-%m-%d %H:%M:%S UTC') ====="

            python sync_repair.py
            EXIT_CODE=$?
            if [ "$EXIT_CODE" -ne 0 ]; then
              echo "Check #${ITERATION} exited with code ${EXIT_CODE}. Keeping 24/7 worker alive for the next check."
            fi

            NOW=$(date +%s)
            ELAPSED=$((NOW - CYCLE_START))
            SLEEP_FOR=$((300 - ELAPSED))
            if [ "$SLEEP_FOR" -gt 0 ] && [ "$((NOW + SLEEP_FOR))" -lt "$END_TIME" ]; then
              echo "Next EduSecure check in ${SLEEP_FOR} seconds."
              sleep "$SLEEP_FOR"
            else
              break
            fi
          done

          echo "Worker window complete; next worker will be queued now."
          exit 0

      - name: Upload sync diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edusecure-sync-diagnostics-${{ github.run_id }}
          path: |
            sync_report.json
            debug_*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Queue next 24/7 worker
        # Only a healthy completed worker may hand off to the next worker.
        # Validation failures/cancelled deploys must never create a dispatch loop.
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Queueing the next EduSecure 24/7 worker..."
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/sync.yml/dispatches \
            -d '{"ref":"main"}'
          echo "Next worker queued successfully."
