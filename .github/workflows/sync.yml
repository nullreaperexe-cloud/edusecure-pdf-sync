name: EduSecure PDF Sync

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "17 * * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Sync EduSecure PDFs
        env:
          PYTHONUNBUFFERED: "1"
          EDUSECURE_USERNAME: ${{ secrets.EDUSECURE_USERNAME }}
          EDUSECURE_PASSWORD: ${{ secrets.EDUSECURE_PASSWORD }}
          AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
          INGEST_URL: https://eightapdf-study-library.nullreaper-exe.chatgpt.site/automation/ingest
        run: python sync_repair_v2.py
