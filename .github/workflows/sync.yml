name: EduSecure PDF Sync
# Announcement pipeline: v4 batch-clean

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "runner.py"
      - "sync.py"
      - "sync_repair.py"
      - "title_cleaner.py"
      - "openrouter_title.py"
      - "announcement_processor.py"
      - "announcement_backfill.py"
      - "test_announcements.py"
      - "test_title_intelligence.py"
      - "test_sync_repair.py"
      - "requirements.txt"
      - ".github/workflows/sync.yml"
  schedule:
    # Backup watchdog only. The active worker checks every 5 minutes itself.
    - cron: "17 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  # v2 uses one bounded sync cycle per run. A distinct group lets this repaired
  # worker deploy immediately even if an older 5.5-hour worker is still alive.
  group: edusecure-5m-worker-v2
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Restore runtime Firestore cache
        uses: actions/cache@v4
        with:
          path: .edusecure_runtime_v2
          key: edusecure-runtime-v2-${{ github.run_id }}
          restore-keys: |
            edusecure-runtime-v2-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate automation code
        id: validate
        run: |
          python -m py_compile runner.py sync.py sync_repair.py title_cleaner.py openrouter_title.py announcement_processor.py announcement_backfill.py pdf_integrity.py
          python -m unittest -v test_title_intelligence.py test_sync_repair.py test_announcements.py test_pdf_integrity.py test_vercel_date.py

      - name: Run one EduSecure sync cycle
        env:
          PYTHONUNBUFFERED: "1"
          EDUSECURE_USERNAME: ${{ secrets.EDUSECURE_USERNAME }}
          EDUSECURE_PASSWORD: ${{ secrets.EDUSECURE_PASSWORD }}
          FIREBASE_ADMIN_EMAIL: ${{ secrets.FIREBASE_ADMIN_EMAIL || vars.FIREBASE_ADMIN_EMAIL }}
          FIREBASE_ADMIN_PASSWORD: ${{ secrets.FIREBASE_ADMIN_PASSWORD }}
          ANNOUNCEMENT_RECOVERY_DAYS: "7"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set +e
          CYCLE_START=$(date +%s)
          echo "===== EduSecure check at $(date -u '+%Y-%m-%d %H:%M:%S UTC') ====="

          python sync_repair.py
          EXIT_CODE=$?

          NOW=$(date +%s)
          ELAPSED=$((NOW - CYCLE_START))
          SLEEP_FOR=$((300 - ELAPSED))
          if [ "$SLEEP_FOR" -gt 0 ]; then
            echo "Cycle finished early; waiting ${SLEEP_FOR}s to preserve a minimum 5-minute cadence."
            sleep "$SLEEP_FOR"
          fi

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "EduSecure cycle failed with code ${EXIT_CODE}."
          else
            echo "EduSecure cycle completed cleanly."
          fi
          exit "$EXIT_CODE"

      - name: Upload sync diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edusecure-sync-diagnostics-${{ github.run_id }}
          path: |
            sync_report.json
            debug_*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Queue next 5-minute worker
        # Validation must pass, but a transient live-sync failure still hands off
        # so the next bounded cycle can self-heal instead of stopping automation.
        if: always() && !cancelled() && steps.validate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Queueing the next EduSecure 5-minute worker..."
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/sync.yml/dispatches \
            -d '{"ref":"main"}'
          echo "Next worker queued successfully."
