name: EduSecure PDF Sync
# Announcement pipeline: v4 batch-clean

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "runner.py"
      - "reliable_http.py"
      - "push_bridge.py"
      - "test_reliability.py"
      - "sync.py"
      - "sync_repair.py"
      - "worker_loop.py"
      - "drive_backup.py"
      - "drive_first.py"
      - "test_drive_first.py"
      - "test_drive_backup.py"
      - "test_worker_loop.py"
      - "supabase_gateway.py"
      - "supabase_materials.py"
      - "supabase_announcements.py"
      - "test_supabase_materials.py"
      - "test_supabase_announcements.py"
      - "title_cleaner.py"
      - "groq_title.py"
      - "test_title_quality.py"
      - "test_title_intelligence.py"
      - "announcement_processor.py"
      - "announcement_backfill.py"
      - "test_announcements.py"
      - "test_sync_repair.py"
      - "requirements.txt"
      - ".github/workflows/sync.yml"
  schedule:
    # Independent five-minute watchdog: a pending run can take over if the
    # current five-hour worker ends, and the finalizer dispatches a successor.
    # GitHub schedule events are best-effort and may be delayed or skipped.
    - cron: "2-59/5 * * * *"

permissions:
  contents: read
  id-token: write
  actions: write # Allow the worker to dispatch its 5-hour successor.

concurrency:
  # Never overlap live EduSecure browsers. Backup failures must not block sync.
  group: edusecure-scheduled-sync-v3
  # Code changes replace the existing worker; scheduled checks never interrupt.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 345 # 5 hours 45 minutes; GitHub-hosted jobs max out at 6h.
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Restore Supabase duplicate-protection cache
        uses: actions/cache@v6
        with:
          path: .edusecure_runtime_v2
          key: edusecure-runtime-v2-${{ github.run_id }}
          restore-keys: |
            edusecure-runtime-v2-

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate automation code
        id: validate
        run: |
          python -m py_compile runner.py sync.py sync_repair.py worker_loop.py supabase_gateway.py supabase_materials.py supabase_announcements.py title_cleaner.py groq_title.py announcement_processor.py announcement_backfill.py pdf_integrity.py reliable_http.py push_bridge.py drive_backup.py drive_first.py
          python -m unittest discover -v

      # Accept repository-scoped GitHub OIDC even when the organization customizes JWT sub.
      - name: Verify both Supabase tables through GitHub OIDC
        env:
          SUPABASE_URL: "https://xudhjwojgxblbsebkzso.supabase.co"
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import supabase_gateway as gateway
          gateway.health()
          lists = {}
          for action, table in [("listMaterials", "study_materials"), ("listAnnouncements", "announcements")]:
              result = gateway.call(action)
              records = result.get("records")
              if not isinstance(records, list):
                  raise RuntimeError(f"Supabase {table} inventory missing")
              lists[table] = records
              print(f"Supabase {table}: {len(records)} accessible records.")

          # Existing identities exercise BOTH protected write paths with no new
          # records or changes. Missing/empty tables skip the duplicate probe.
          materials = lists["study_materials"]
          if materials:
              known = next((r for r in materials if r.get("id") and r.get("title") and r.get("pdf_url")), None)
              if known:
                  confirmed = gateway.call("insertMaterial", record={
                      "id": known["id"], "title": known["title"], "pdf_url": known["pdf_url"]
                  })
                  if not confirmed.get("duplicate"):
                      raise RuntimeError("Supabase PDF duplicate write probe failed")
                  print("Supabase PDF write path: authenticated and safely deduplicated.")

          announcements = lists["announcements"]
          if announcements:
              known = next((r for r in announcements if r.get("id") and r.get("title") and r.get("published") is True), None)
              if known:
                  confirmed = gateway.call("publishAnnouncement", record={
                      "id": known["id"], "title": known["title"], "ai_status": "pending"
                  })
                  if not confirmed.get("duplicate"):
                      raise RuntimeError("Supabase announcements duplicate write probe failed")
                  print("Supabase announcement write path: authenticated and safely deduplicated.")
          PY

      - name: Keep EduSecure worker alive for 5 hours (check every 5 minutes)
        id: worker
        env:
          PYTHONUNBUFFERED: "1"
          EDUSECURE_USERNAME: ${{ secrets.EDUSECURE_USERNAME }}
          EDUSECURE_PASSWORD: ${{ secrets.EDUSECURE_PASSWORD }}
          SUPABASE_URL: "https://xudhjwojgxblbsebkzso.supabase.co"
          ANNOUNCEMENT_RECOVERY_DAYS: "7"
          CHECK_WEBSITE_DATE: "0"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WORKER_DURATION_MINUTES: "300"
          WORKER_INTERVAL_SECONDS: "300"
          WORKER_CYCLE_TIMEOUT_SECONDS: "1080"
          GDRIVE_BACKUP_INTERVAL_SECONDS: "3600"
          GDRIVE_BACKUP_TIMEOUT_SECONDS: "240"
          GDRIVE_BACKUP_OAUTH_JSON: ${{ secrets.GDRIVE_BACKUP_OAUTH_JSON }}
          GDRIVE_BACKUP_CLIENT_ID: ${{ secrets.GDRIVE_BACKUP_CLIENT_ID }}
          GDRIVE_BACKUP_CLIENT_SECRET: ${{ secrets.GDRIVE_BACKUP_CLIENT_SECRET }}
          GDRIVE_BACKUP_REFRESH_TOKEN: ${{ secrets.GDRIVE_BACKUP_REFRESH_TOKEN }}
          GDRIVE_BACKUP_FOLDER_ID: ${{ secrets.GDRIVE_BACKUP_FOLDER_ID }}
        run: |
          python -u worker_loop.py

      - name: Dispatch next five-hour worker
        # Only renew a completed healthy worker; the independent scheduled
        # watchdog retries after an all-failed worker without a tight loop.
        if: ${{ always() && steps.worker.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set +e
          gh workflow run sync.yml --repo "$GH_REPO" --ref main
          RESULT=$?
          if [ "$RESULT" -eq 0 ]; then
            echo "Next worker dispatched. Concurrency will serialize the handoff."
          else
            echo "::warning::Unable to dispatch successor. The five-minute scheduled watchdog will retry."
          fi
          exit "$RESULT"

      - name: Add cycle status to the run summary
        if: always()
        run: |
          if [ -f worker_summary.json ]; then
            echo '### 5-hour EduSecure worker' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat worker_summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f drive_backup_report.json ]; then
            echo '### Google Drive backup' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat drive_backup_report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f sync_report.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat sync_report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload sync diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: edusecure-sync-diagnostics-${{ github.run_id }}
          path: |
            sync_report.json
            worker_summary.json
            drive_backup_report.json
            debug_*.png
          if-no-files-found: ignore
          retention-days: 7

