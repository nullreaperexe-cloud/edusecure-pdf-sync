name: EduSecure PDF Sync

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "runner.py"
      - "runner_v2.py"
      - "runner_v3.py"
      - "runner_v4.py"
      - "runner_v5.py"
      - "sync.py"
      - "sync_repair.py"
      - "requirements.txt"
      - ".github/workflows/sync.yml"
  schedule:
    # 24/7 monitoring: run every 5 minutes on GitHub-hosted runners.
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check website latest date, then sync newer EduSecure attachments
        env:
          PYTHONUNBUFFERED: "1"
          EDUSECURE_USERNAME: ${{ secrets.EDUSECURE_USERNAME }}
          EDUSECURE_PASSWORD: ${{ secrets.EDUSECURE_PASSWORD }}
          FIREBASE_ADMIN_PASSWORD: ${{ secrets.FIREBASE_ADMIN_PASSWORD }}
        run: python runner_v5.py

      - name: Upload sync diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edusecure-sync-diagnostics
          path: |
            sync_report.json
            debug_*.png
          if-no-files-found: ignore
          retention-days: 7
