name: One-time EduSecure Title Cleanup

on:
  workflow_dispatch:
  schedule:
    # One bounded historical grammar pass per day; never on every code push.
    - cron: "23 8 * * *"

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install requests
        run: python -m pip install requests

      - name: Run title and subject intelligence tests
        run: python -m unittest -v test_title_intelligence.py

      - name: Clean and audit existing EduSecure records
        env:
          FIREBASE_ADMIN_PASSWORD: ${{ secrets.FIREBASE_ADMIN_PASSWORD }}
          PYTHONUNBUFFERED: "1"
          TITLE_DESCRIPTION_ONLY: "1"
        run: python title_cleaner.py
