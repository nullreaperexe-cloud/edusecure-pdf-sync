name: One-time EduSecure Title Cleanup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/title-cleanup.yml"
  schedule:
    # One bounded historical grammar pass per day; never on every code push.
    - cron: "23 8 * * *"

permissions:
  contents: read
  id-token: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run title and subject intelligence tests
        run: python -m unittest -v test_title_intelligence.py

      - name: Clean and audit existing EduSecure records
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SUPABASE_URL: "https://xudhjwojgxblbsebkzso.supabase.co"
          TITLE_CLEANUP_MAX_AI_CALLS: "12"
          PYTHONUNBUFFERED: "1"
        run: python supabase_title_cleanup.py
