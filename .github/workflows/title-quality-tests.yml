name: EduSecure Title Intelligence Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "title_quality.py"
      - "title_cleaner.py"
      - "groq_title.py"
      - "supabase_title_cleanup.py"
      - "test_title_quality.py"
      - "test_title_intelligence.py"
      - ".github/workflows/title-quality-tests.yml"

permissions:
  contents: read

jobs:
  title-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check title scripts compile
        run: python -m py_compile title_quality.py title_cleaner.py groq_title.py supabase_title_cleanup.py
      - name: Run title grammar and hallucination regression tests
        run: python -m unittest -v test_title_intelligence.py test_title_quality.py
